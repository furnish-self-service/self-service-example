# A kit: apps of this collection that users install together.
# Required items are always installed; users can deselect optional ones.
description: Handy tools for working in the terminal
categories: [System]
items:
  - app: htop
    required: true
  - app: cowsay          # optional, selected by default
  - app: hyperfine
    selected: false      # optional, not selected by default
