$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
metadata:
  furnish:
    description: Interactive process viewer for the terminal.
    categories: [System, Monitoring]
    icon: icons/htop.svg
    recommended: "[equals(parameters('role'), 'developer')]"
resources:
  # htop has no Windows version; with every resource skipped there, furnish shows the app as
  # not available on Windows.
  - name: htop package
    type: Furnish/Package
    condition: "[not(equals(context().os.family, 'Windows'))]"
    properties:
      name: htop
