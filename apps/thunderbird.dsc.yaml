$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
metadata:
  furnish:
    name: Thunderbird
    description: Email, calendar and contacts.
    categories: [Communication, Office]
    icon: icons/thunderbird.svg
    recommended: "[equals(parameters('role'), 'office')]"
resources:
  - name: thunderbird (winget)
    type: Furnish/Package
    condition: "[equals(context().os.family, 'Windows')]"
    properties:
      name: Mozilla.Thunderbird
  - name: thunderbird
    type: Furnish/Package
    condition: "[not(equals(context().os.family, 'Windows'))]"
    properties:
      name: thunderbird
