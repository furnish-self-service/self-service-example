$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
metadata:
  furnish:
    name: Zoom
    description: Video meetings and webinars.
    categories: [Communication]
    icon: icons/zoom.svg
    recommended: true
resources:
  - name: zoom
    type: Furnish/Package
    condition: "[or(equals(context().os.family, 'Windows'), equals(context().os.family, 'macOS'))]"
    properties:
      name: zoom
      namesByManager:
        winget: Zoom.Zoom
