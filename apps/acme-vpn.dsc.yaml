$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
# Sets up the connection "Acme VPN" with one OpenVPN configuration, files/acme.ovpn, on every
# system. The client comes from the app openvpn-client. Writing to system folders needs
# administrator rights, so install this app through the furnish service (a collection your
# organization presets). furnish tells the app's status as the user, also with the service.
metadata:
  furnish:
    name: Acme VPN
    description: Connection to the Acme company network over OpenVPN. You sign in with your Acme account when you connect.
    categories: [Network]
    icon: icons/acme-vpn.svg
    recommended: true
    dependencies:
      - app: openvpn-client
        required: true
resources:
  # Windows: in config\, not config-auto\. OpenVPN GUI lists the configurations in config\ and
  # asks for the user's name and password when they connect (auth-user-pass). The service that
  # starts config-auto\ at boot has nobody to ask.
  - name: OpenVPN configuration (Windows)
    type: Furnish/File
    condition: "[equals(context().os.family, 'Windows')]"
    properties:
      path: C:\Program Files\OpenVPN\config\acme.ovpn
      source: files/acme.ovpn

  # macOS: Tunnelblick installs a configuration (.tblk) from its Temp folder, which must belong
  # to root:wheel and not be writable by others. Its installer runs as root without asking and
  # copies the .tblk to Shared/: https://www.tunnelblick.net/cInstallFromCommandLine.html
  # Tunnelblick makes Temp/ readable only by root, and furnish tells the app's status as the
  # user, so the profile waits in a folder of its own, and the install step builds the .tblk
  # in Temp/ from it.
  - name: Tunnelblick profile folder
    type: Furnish/Directory
    condition: "[equals(context().os.family, 'macOS')]"
    properties:
      path: /Library/Application Support/Acme VPN
      mode: '755'
  - name: Tunnelblick profile
    type: Furnish/File
    condition: "[equals(context().os.family, 'macOS')]"
    dependsOn: ["[resourceId('Furnish/Directory', 'Tunnelblick profile folder')]"]
    properties:
      path: /Library/Application Support/Acme VPN/config.ovpn
      source: files/acme.ovpn
      mode: '644'
  # Only root may read Tunnelblick's copy in Shared/, but anyone may look at its date. The test
  # passes when the copy exists and the profile isn't newer, so a changed profile is installed
  # again (cp -p keeps the profile's date). `present`: the configuration is installed, maybe from
  # an older profile, so the app shows an update and can be uninstalled. `remove` succeeds when
  # there is nothing to delete.
  - name: Tunnelblick installs the configuration
    type: Furnish/Command
    condition: "[equals(context().os.family, 'macOS')]"
    dependsOn: ["[resourceId('Furnish/File', 'Tunnelblick profile')]"]
    properties:
      test:
        command:
          - /bin/sh
          - -c
          - 'test -f "$2" && test ! "$1" -nt "$2"'
          - sh
          - /Library/Application Support/Acme VPN/config.ovpn
          - /Library/Application Support/Tunnelblick/Shared/Acme VPN.tblk/Contents/Resources/config.ovpn
      present:
        command: [/bin/test, -d, /Library/Application Support/Tunnelblick/Shared/Acme VPN.tblk]
      set:
        - /bin/sh
        - -c
        - >-
          tblk="/Library/Application Support/Tunnelblick/Temp/Acme VPN.tblk";
          rm -rf "$tblk" && mkdir -p "$tblk/Contents/Resources" &&
          cp -p "$1" "$tblk/Contents/Resources/config.ovpn" &&
          chown -R root:wheel "$tblk" && chmod -R go-w "$tblk" &&
          /Applications/Tunnelblick.app/Contents/Resources/installer 0x7000 "$tblk" &&
          rm -rf "$tblk"
        - sh
        - /Library/Application Support/Acme VPN/config.ovpn
      remove:
        - /bin/rm
        - -rf
        - /Library/Application Support/Tunnelblick/Shared/Acme VPN.tblk
        - /Library/Application Support/Tunnelblick/Temp/Acme VPN.tblk

  # Linux: NetworkManager imports the configuration as the connection "Acme VPN".
  - name: OpenVPN configuration (Linux)
    type: Furnish/File
    condition: "[equals(context().os.family, 'Linux')]"
    properties:
      path: /etc/openvpn/acme-vpn.ovpn
      source: files/acme.ovpn
      mode: '600'
  # `nmcli connection import` copies the CA certificate into the home folder of whoever runs it
  # (root, through the furnish service). The connection's vpn.data says where
  # ("ca = /root/.local/share/networkmanagement/certificates/nm-openvpn/acme-vpn-ca.pem, ...", or
  # /root/.cert/nm-openvpn/ where ~/.local/share doesn't exist), so it is read before the
  # connection is deleted. `set` first deletes an earlier connection,
  # also one an interrupted import left under the file's name, so there is only ever one.
  # The stamp /etc/openvpn/acme-vpn.imported records which version of the profile NetworkManager
  # imported: it has the profile's date. Users can't read NetworkManager's connection files, nor
  # see their dates, and furnish runs the test as the user. Comparing dates needs no read access
  # to the profile, only to /etc/openvpn. `nmcli connection export` can't stand in for the stamp
  # with `test.file`: it writes the options in another order, quotes values ('vpn.acme.example'),
  # puts the path of the copied CA certificate in place of the embedded one, leaves out options
  # such as resolv-retry, remote-cert-tls and verb, and adds auth-nocache, script-security, user
  # and group. The test fails when the connection or the stamp is
  # missing or the profile is newer than the stamp, so a changed profile is imported again.
  # `present`: the connection exists, maybe from an older profile, so the app shows an update and
  # can be uninstalled. `remove` succeeds when there is nothing to delete.
  - name: NetworkManager connection
    type: Furnish/Command
    condition: "[equals(context().os.family, 'Linux')]"
    dependsOn: ["[resourceId('Furnish/File', 'OpenVPN configuration (Linux)')]"]
    properties:
      test:
        command:
          - /bin/sh
          - -c
          - >-
            test "$(nmcli -g connection.id connection show id 'Acme VPN' 2>/dev/null)" = 'Acme VPN' &&
            test -f "$2" && test ! "$1" -nt "$2"
          - sh
          - /etc/openvpn/acme-vpn.ovpn
          - /etc/openvpn/acme-vpn.imported
      present:
        command: [nmcli, -g, connection.id, connection, show, id, Acme VPN]
        output: Acme VPN
      set:
        - /bin/sh
        - -c
        - >-
          for id in 'Acme VPN' acme-vpn; do
          ca=$(nmcli -g vpn.data connection show id "$id" 2>/dev/null | tr ',' '\n' | sed -n 's/^ *ca = //p');
          if [ -n "$(nmcli -g connection.id connection show id "$id" 2>/dev/null)" ]; then nmcli connection delete id "$id" >/dev/null || exit 1; fi;
          case "$ca" in */networkmanagement/certificates/nm-openvpn/* | */.cert/nm-openvpn/*) rm -f "$ca" ;; esac;
          done;
          nmcli connection import type openvpn file /etc/openvpn/acme-vpn.ovpn &&
          nmcli connection modify id acme-vpn connection.id 'Acme VPN' &&
          touch -r /etc/openvpn/acme-vpn.ovpn /etc/openvpn/acme-vpn.imported &&
          chmod 644 /etc/openvpn/acme-vpn.imported
      remove:
        - /bin/sh
        - -c
        - >-
          ca=$(nmcli -g vpn.data connection show id 'Acme VPN' 2>/dev/null | tr ',' '\n' | sed -n 's/^ *ca = //p');
          if [ -n "$(nmcli -g connection.id connection show id 'Acme VPN' 2>/dev/null)" ]; then nmcli connection delete id 'Acme VPN' >/dev/null || exit 1; fi;
          case "$ca" in */networkmanagement/certificates/nm-openvpn/* | */.cert/nm-openvpn/*) rm -f "$ca" ;; esac;
          rm -f /etc/openvpn/acme-vpn.imported
