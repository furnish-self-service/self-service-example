$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
metadata:
  furnish:
    name: Google Chrome
    description: Web browser from Google.
    categories: [Internet]
    icon: icons/google-chrome.svg
resources:
  - name: google-chrome
    type: Furnish/Package
    condition: "[or(equals(context().os.family, 'Windows'), equals(context().os.family, 'macOS'))]"
    properties:
      name: google-chrome
      namesByManager:
        winget: Google.Chrome
