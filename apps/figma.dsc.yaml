$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
metadata:
  furnish:
    name: Figma
    description: Interface design and prototyping, together in real time.
    categories: [Graphics]
    icon: icons/figma.svg
    recommended: "[equals(parameters('role'), 'design')]"
resources:
  - name: figma
    type: Furnish/Package
    condition: "[or(equals(context().os.family, 'Windows'), equals(context().os.family, 'macOS'))]"
    properties:
      name: figma
      namesByManager:
        winget: Figma.Figma
