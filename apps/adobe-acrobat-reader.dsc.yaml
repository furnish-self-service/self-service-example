$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
metadata:
  furnish:
    description: View, sign and comment on PDF documents.
    categories: [Office]
    icon: icons/adobe-acrobat-reader.svg
    recommended: "[equals(parameters('role'), 'office')]"
resources:
  # No package in the Linux distributions' repositories: without a resource for Linux, furnish
  # shows adobe-acrobat-reader as not available there.
  - name: adobe-acrobat-reader (winget)
    type: Furnish/Package
    condition: "[equals(context().os.family, 'Windows')]"
    properties:
      name: Adobe.Acrobat.Reader.64-bit
  - name: adobe-acrobat-reader (Homebrew)
    type: Furnish/Package
    condition: "[equals(context().os.family, 'macOS')]"
    properties:
      name: adobe-acrobat-reader
