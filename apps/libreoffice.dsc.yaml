$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
metadata:
  furnish:
    name: LibreOffice
    description: Office suite with a word processor, spreadsheets, presentations and more.
    categories: [Office]
    icon: icons/libreoffice.svg
    recommended: "[equals(parameters('role'), 'office')]"
resources:
  - name: libreoffice
    type: Furnish/Package
    properties:
      name: libreoffice
      namesByManager:
        pacman: libreoffice-fresh   # Arch splits it into libreoffice-fresh and libreoffice-still
        winget: TheDocumentFoundation.LibreOffice
