$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
metadata:
  furnish:
    name: KeePassXC
    description: Password manager that keeps your passwords in an encrypted database.
    categories: [Security]
    icon: icons/keepassxc.svg
    recommended: true
resources:
  - name: keepassxc (winget)
    type: Furnish/Package
    condition: "[equals(context().os.family, 'Windows')]"
    properties:
      name: KeePassXCTeam.KeePassXC
  - name: keepassxc
    type: Furnish/Package
    condition: "[not(equals(context().os.family, 'Windows'))]"
    properties:
      name: keepassxc
